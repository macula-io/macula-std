[package]
name = "macula-std"
version = "0.1.0"
edition = "2021"
authors = ["Macula contributors"]
description = "std shim crate for macula-kernel. Re-exports core+alloc under std namespaces; provides kernel-backed Instant/SystemTime/Mutex/HashMap/io."
license = "MIT OR Apache-2.0"
repository = "https://github.com/macula-io/macula-std"
readme = "README.md"

[dependencies]
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "rwlock"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
